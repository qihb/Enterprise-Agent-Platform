<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc">
  <title id="title">企业 Agent 平台阶段架构与升级路线</title>
  <desc id="desc">V1 从 PDF 问答起步，V2 接飞书与真实权限，V3 加只读 Agent，V4 企业生产化，V5 受控办理，V6 集团扩展。图展示逐版实现的目标架构，不表示所有模块已实现或必须在首版完成。</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #182c43; }
      .title { font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #5c6e81; }
      .section { font-size: 24px; font-weight: 650; }
      .heading { font-size: 22px; font-weight: 650; }
      .body { font-size: 18px; fill: #52677a; }
      .small { font-size: 16px; fill: #617489; }
      .tag { font-size: 16px; font-weight: 600; }
      .number { font-size: 20px; font-weight: 700; fill: white; text-anchor: middle; }
      .card { fill: white; stroke: #d4dfeb; stroke-width: 1.5; }
      .blue { fill: #eef5ff; stroke: #b7d2f7; stroke-width: 1.5; }
      .amber { fill: #fff8ed; stroke: #e6c994; stroke-width: 1.5; }
      .future { fill: #f5f6f8; stroke: #b8c1cd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .flow { fill: none; stroke: #4777a8; stroke-width: 2.5; }
      .model-flow { fill: none; stroke: #4777a8; stroke-width: 2.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4777a8"/>
    </marker>
    <marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8 0 L0 4 L8 8 Z" fill="#4777a8"/>
    </marker>
  </defs>
  <rect width="1800" height="1800" fill="#f7f9fc"/>
  <rect x="48" y="48" width="7" height="82" rx="3" fill="#2563eb"/>
  <text x="78" y="85" class="small" style="letter-spacing: 3px; fill: #2563eb;">ENTERPRISE AGENT PLATFORM / 设计预览</text>
  <text x="76" y="132" class="title">企业 Agent 平台 · 阶段架构</text>
  <text x="78" y="168" class="subtitle">先跑通 PDF 问答，再接多入口、业务工具与企业治理；完整目标架构逐版实现。</text>
  <rect x="1230" y="58" width="522" height="60" rx="14" fill="#eaf0f7"/>
  <text x="1252" y="84" class="tag">当前：V1 设计 · 所有版本均未实现</text>
  <text x="1252" y="107" class="small">Next.js 为候选；云资源与升级组件待确认</text>
  <rect x="80" y="192" width="17" height="17" rx="4" class="blue"/>
  <text x="107" y="206" class="small">V1 核心 / 技术基线</text>
  <rect x="295" y="192" width="17" height="17" rx="4" class="amber"/>
  <text x="322" y="206" class="small">按启用范围落实治理</text>
  <rect x="552" y="192" width="17" height="17" rx="4" class="future"/>
  <text x="579" y="206" class="small">后续版本能力</text>
  <text x="805" y="206" class="small">图中框表示逻辑职责，不代表独立微服务。</text>

  <rect x="80" y="244" width="280" height="132" rx="16" class="future"/>
  <text x="102" y="278" class="heading">V2 飞书文档 / 知识库</text>
  <text x="102" y="310" class="body">部门在源系统维护资料</text>
  <text x="102" y="340" class="body">内容、版本、源读取权限</text>
  <rect x="380" y="244" width="280" height="132" rx="16" class="blue"/>
  <text x="402" y="278" class="heading">V1 PDF 文件入口</text>
  <text x="402" y="310" class="body">先用 3 份无敏感演示 PDF</text>
  <text x="402" y="340" class="body">其他格式按资料需求增加</text>
  <rect x="730" y="244" width="280" height="132" rx="16" class="future"/>
  <text x="752" y="278" class="heading">V2 飞书统一身份</text>
  <text x="752" y="310" class="body">V1 使用固定演示身份</text>
  <text x="752" y="340" class="body">部门、群组与权限主体</text>
  <rect x="1030" y="244" width="280" height="132" rx="16" class="blue"/>
  <text x="1052" y="278" class="heading">V1 问答 / 后续员工入口</text>
  <text x="1052" y="310" class="body">PDF 页码与受控原文查看</text>
  <text x="1052" y="340" class="body">答案、引用、反馈与转人工</text>
  <rect x="1430" y="244" width="322" height="132" rx="16" fill="#182f4c"/>
  <text x="1452" y="277" class="heading" style="fill: white;">DeepSeek API</text>
  <text x="1452" y="309" class="body" style="fill: #d6e3f2;">外部模型服务，不是本地模型</text>
  <text x="1452" y="340" class="body" style="fill: #d6e3f2;">只接收获准外发的必要上下文</text>
  <path d="M220 376 V418" class="flow"/>
  <path d="M520 376 V418" class="flow"/>
  <path d="M870 376 V418" class="flow"/>
  <path d="M1170 376 V418" class="flow"/>

  <rect x="48" y="426" width="1336" height="782" rx="24" fill="white" stroke="#bdcede" stroke-width="2"/>
  <text x="80" y="464" class="section">平台应用层</text>
  <text x="270" y="463" class="body">TypeScript 业务模块 · 统一权限策略 · 供应商能力通过接口隔离</text>
  <rect x="80" y="488" width="580" height="694" rx="18" fill="#f5f8fc"/>
  <rect x="730" y="488" width="580" height="694" rx="18" fill="#f5f8fc"/>
  <text x="104" y="524" class="section">A · 知识接入与维护</text>
  <text x="754" y="524" class="section">B · 在线问答与生成</text>

  <rect x="104" y="546" width="532" height="106" rx="14" class="blue"/>
  <circle cx="138" cy="582" r="18" fill="#2563eb"/><text x="138" y="589" class="number">1</text>
  <text x="169" y="589" class="heading">V1 PDF 导入 / V2 增量同步</text>
  <text x="128" y="619" class="body">同步获准范围；识别内容、权限与删除变化</text>
  <text x="128" y="642" class="small">连接器能读到 ≠ 当前员工有权读取</text>
  <path d="M370 652 V680" class="flow"/>

  <rect x="104" y="690" width="532" height="106" rx="14" class="blue"/>
  <circle cx="138" cy="726" r="18" fill="#2563eb"/><text x="138" y="733" class="number">2</text>
  <text x="169" y="733" class="heading">解析、结构保留与索引准备</text>
  <text x="128" y="763" class="body">章节定位、分块、中文分词、本地向量生成</text>
  <text x="128" y="786" class="small">分块继承文件权限，并绑定来源版本</text>
  <path d="M370 796 V824" class="flow"/>

  <rect x="104" y="834" width="532" height="106" rx="14" class="blue"/>
  <circle cx="138" cy="870" r="18" fill="#2563eb"/><text x="138" y="877" class="number">3</text>
  <text x="169" y="877" class="heading">知识登记与有效版本管理</text>
  <text x="128" y="907" class="body">来源、哈希、ACL、密级、状态与引用位置</text>
  <text x="128" y="930" class="small">权限缺失或失效、文档停用 → 不可检索</text>
  <path d="M370 940 V968" class="flow"/>

  <rect x="104" y="978" width="532" height="106" rx="14" class="amber"/>
  <circle cx="138" cy="1014" r="18" fill="#b87923"/><text x="138" y="1021" class="number">+</text>
  <text x="169" y="1021" class="heading">V1 资料页 / V2 轻量管理台</text>
  <text x="128" y="1051" class="body">来源登记、文件上传、负责人、复审与停用</text>
  <text x="128" y="1074" class="small">飞书内容留在飞书维护；界面与治理规则待确认</text>
  <text x="112" y="1124" class="body">维护责任：部门负责资料正确性</text>
  <text x="112" y="1154" class="body">平台负责同步、索引、授权和可追溯性</text>

  <rect x="754" y="546" width="532" height="106" rx="14" class="blue"/>
  <circle cx="788" cy="582" r="18" fill="#2563eb"/><text x="788" y="589" class="number">1</text>
  <text x="819" y="589" class="heading">V1 演示 / V2 真实身份授权</text>
  <text x="778" y="619" class="body">校验用户身份、请求权限与输入密级</text>
  <text x="778" y="642" class="small">不接实时业务工具时，不宣称已完成实时诊断</text>
  <path d="M1020 652 V680" class="flow"/>

  <rect x="754" y="690" width="532" height="106" rx="14" class="blue"/>
  <circle cx="788" cy="726" r="18" fill="#2563eb"/><text x="788" y="733" class="number">2</text>
  <text x="819" y="733" class="heading">权限前置的混合检索</text>
  <text x="778" y="763" class="body">关键词 + 向量 → 分块去重 → RRF 排名融合</text>
  <text x="778" y="786" class="small">两路 SQL 均过滤 ACL、业务域、密级与有效版本</text>
  <path d="M1020 796 V824" class="flow"/>

  <rect x="754" y="834" width="532" height="106" rx="14" class="blue"/>
  <circle cx="788" cy="870" r="18" fill="#2563eb"/><text x="788" y="877" class="number">3</text>
  <text x="819" y="877" class="heading">Model Gateway · 模型网关</text>
  <text x="778" y="907" class="body">必要上下文、外发策略、超时与调用管理</text>
  <text x="778" y="930" class="small">严格受限内容阻断；脱敏不自动获得外发许可</text>
  <path d="M1286 870 H1360 V310 H1430" class="model-flow"/>
  <rect x="1326" y="655" width="66" height="140" rx="8" fill="#f7f9fc"/>
  <text x="1358" y="686" class="small" text-anchor="middle">策略</text>
  <text x="1358" y="710" class="small" text-anchor="middle">允许</text>
  <text x="1358" y="751" class="small" text-anchor="middle">请求</text>
  <text x="1358" y="775" class="small" text-anchor="middle">/ 响应</text>
  <path d="M1020 940 V968" class="flow"/>

  <rect x="754" y="978" width="532" height="106" rx="14" class="blue"/>
  <circle cx="788" cy="1014" r="18" fill="#2563eb"/><text x="788" y="1021" class="number">4</text>
  <text x="819" y="1021" class="heading">证据检查、引用与回答</text>
  <text x="778" y="1051" class="body">有证据则回答；证据不足则拒答或转人工</text>
  <text x="778" y="1074" class="small">返回原文、版本与定位；读取 / 下载重新授权</text>
  <text x="762" y="1124" class="body">读取权限 ≠ 外发许可</text>
  <text x="762" y="1154" class="body">模型不直接读取全库，也不持有无限制业务权限</text>

  <rect x="1410" y="426" width="342" height="782" rx="24" class="amber"/>
  <text x="1434" y="466" class="section">贯穿全链路的保障</text>
  <text x="1434" y="496" class="small">基础安全必须前置，实现方式待定</text>
  <path d="M1434 517 H1728" stroke="#e2cda9"/>
  <text x="1434" y="555" class="heading">权限与数据分级</text>
  <text x="1434" y="586" class="body">文件 ACL；失效默认拒绝</text>
  <text x="1434" y="613" class="body">源权限不得被平台扩大</text>
  <text x="1434" y="640" class="body">严格受限内容禁止外发</text>
  <path d="M1434 666 H1728" stroke="#e2cda9"/>
  <text x="1434" y="704" class="heading">逐步完善审计与备份</text>
  <text x="1434" y="735" class="body">脱敏追加式事件日志</text>
  <text x="1434" y="762" class="body">会话 ID、时间戳、格式版本</text>
  <text x="1434" y="789" class="body">真实资料前加密；V4 完整运营</text>
  <text x="1434" y="816" class="small">密钥 / 令牌 / 密码不得进入日志</text>
  <path d="M1434 842 H1728" stroke="#e2cda9"/>
  <text x="1434" y="880" class="heading">评测、反馈与运行监测</text>
  <text x="1434" y="911" class="body">召回、引用、越权与拒答</text>
  <text x="1434" y="938" class="body">延迟、成本、同步与过期率</text>
  <text x="1434" y="965" class="small">V1 约 10 题；V4 正式企业验收</text>
  <path d="M1434 992 H1728" stroke="#e2cda9"/>
  <text x="1434" y="1030" class="heading">V3 Agent / V6 业务域治理</text>
  <text x="1434" y="1061" class="body">Skill、References、只读工具</text>
  <text x="1434" y="1088" class="body">知识范围、负责人、更新周期</text>
  <text x="1434" y="1115" class="body">域归属不直接等于阅读权限</text>
  <text x="1434" y="1160" class="small">撤权时效与复审规则仍需确认</text>

  <path d="M370 1208 V1244" class="flow"/>
  <path d="M1020 1244 V1208" class="flow"/>
  <text x="402" y="1235" class="small">入库 / 更新</text>
  <text x="1040" y="1235" class="small">授权查询 / 受控读取</text>
  <rect x="48" y="1254" width="1704" height="168" rx="22" fill="#eaf0f8" stroke="#cbd9e8"/>
  <text x="80" y="1290" class="section">受控数据与计算层</text>
  <rect x="80" y="1308" width="510" height="88" rx="12" class="card"/>
  <text x="100" y="1338" class="heading">PostgreSQL + pgvector</text>
  <text x="100" y="1366" class="body">元数据、组织映射、文件 ACL、全文索引与向量</text>
  <rect x="610" y="1308" width="450" height="88" rx="12" class="card"/>
  <text x="630" y="1338" class="heading">本地中文 Embedding</text>
  <text x="630" y="1366" class="body">入库与查询使用一致模型指纹与处理约定</text>
  <rect x="1080" y="1308" width="640" height="88" rx="12" class="card"/>
  <text x="1100" y="1338" class="heading">统一文件存储 → 本地受控目录 → V4 私有 OSS</text>
  <text x="1100" y="1366" class="body">真实资料前加密；受控下载；迁移校验哈希、版本与权限</text>

  <rect x="48" y="1442" width="1704" height="116" rx="20" class="future"/>
  <text x="80" y="1478" class="section">迭代路线 · 每版可用，按证据升级</text>
  <text x="80" y="1511" class="body">V1 PDF 问答</text>
  <text x="360" y="1511" class="body">V2 多入口知识库</text>
  <text x="640" y="1511" class="body">V3 只读 Agent</text>
  <text x="920" y="1511" class="body">V4 企业生产</text>
  <text x="1200" y="1511" class="body">V5 受控办理</text>
  <text x="1480" y="1511" class="body">V6 集团扩展</text>
  <text x="80" y="1540" class="small">本机主链路</text>
  <text x="360" y="1540" class="small">飞书、身份与同步</text>
  <text x="640" y="1540" class="small">流程与实时证据</text>
  <text x="920" y="1540" class="small">云、安全、恢复、监控</text>
  <text x="1200" y="1540" class="small">确认、审批与幂等</text>
  <text x="1480" y="1540" class="small">多域隔离、按需扩容</text>
  <text x="52" y="1592" class="small">2026-11-06 · V4 是企业级只读 Agent 的生产基线，V5 / V6 按业务需要；具体框架、运行组件与云资源待确认。</text>
  <text x="52" y="1620" class="small">完整图为逐版实现的目标，不代表组件已实现或生产合规已验证；不默认引入独立搜索、微服务或多 Agent。</text>
  <g fill="#4777a8">
    <path d="M211 402 L220 418 L229 402 Z"/>
    <path d="M511 402 L520 418 L529 402 Z"/>
    <path d="M861 402 L870 418 L879 402 Z"/>
    <path d="M1161 402 L1170 418 L1179 402 Z"/>
    <path d="M361 664 L370 680 L379 664 Z"/>
    <path d="M361 808 L370 824 L379 808 Z"/>
    <path d="M361 952 L370 968 L379 952 Z"/>
    <path d="M1011 664 L1020 680 L1029 664 Z"/>
    <path d="M1011 808 L1020 824 L1029 808 Z"/>
    <path d="M1011 952 L1020 968 L1029 952 Z"/>
    <path d="M1414 301 L1430 310 L1414 319 Z"/>
    <path d="M1302 861 L1286 870 L1302 879 Z"/>
    <path d="M361 1228 L370 1244 L379 1228 Z"/>
    <path d="M1011 1224 L1020 1208 L1029 1224 Z"/>
  </g>
</svg>
